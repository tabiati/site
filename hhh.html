<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه بازرسی امنیتی محیط مرورگر</title>
    <style>
        /* --------------------------------------------------------------------
           اقدامات امنیتی CSS: جلوگیری از انتخاب متن و چاپ صفحه
           -------------------------------------------------------------------- */
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent-blue: #58a6ff;
            --success: #2ea043;
            --warning: #d29922;
            --danger: #f85149;
            --font-family: system-ui, -apple-system, sans-serif;
        }

        /* قفل کردن قابلیت انتخاب متن در کل صفحه */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* جلوگیری از Select شدن متن */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* اگر کسی سعی کند صفحه را پرینت بگیرد (Ctrl+P) صفحه سفید/خالی چاپ می‌شود */
        @media print {
            body {
                display: none !important;
            }
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            line-height: 1.6;
        }

        .scanner-container {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 700px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            color: var(--accent-blue);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #8b949e;
            font-size: 0.95rem;
        }

        .btn-scan {
            display: block;
            width: 100%;
            padding: 1rem;
            background-color: var(--accent-blue);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-scan:hover {
            background-color: #3182ce;
            color: #fff;
        }

        .btn-scan:disabled {
            background-color: #30363d;
            color: #8b949e;
            cursor: not-allowed;
        }

        .results-container {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .check-item {
            background-color: #000000;
            border-right: 4px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .check-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .check-item.safe { border-right-color: var(--success); }
        .check-item.warn { border-right-color: var(--warning); }
        .check-item.danger { border-right-color: var(--danger); }

        .check-title {
            font-weight: bold;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .check-title.safe { color: var(--success); }
        .check-title.warn { color: var(--warning); }
        .check-title.danger { color: var(--danger); }

        .check-desc {
            font-size: 0.9rem;
            color: #a5d6ff;
        }

        .final-verdict {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            display: none;
        }

        .verdict-safe { background-color: rgba(46, 160, 67, 0.15); color: var(--success); border: 1px solid var(--success); }
        .verdict-danger { background-color: rgba(248, 81, 73, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    </style>
</head>
<body>

<div class="scanner-container">
    <div class="header">
        <h1>🛡️ بازرس امنیتی محیط مرورگر</h1>
        <p>این سامانه تلاش‌های سرقت اطلاعات در لایه وب را مسدود و بررسی می‌کند.</p>
    </div>

    <button id="startScanBtn" class="btn-scan">🔍 شروع اسکن امنیتی محیط</button>

    <div class="results-container" id="resultsArea">
        <!-- نتایج اسکن در اینجا اضافه می‌شوند -->
    </div>

    <div id="finalVerdict" class="final-verdict"></div>
</div>

<script>
    // ========================================================================
    // بخش اول: قفل‌های فیزیکی و ممانعت از سرقت دستی
    // ========================================================================

    // 1. مسدود کردن کلیک‌راست
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
    });

    // 2. مسدود کردن عملیات کپی و کات
    document.addEventListener('copy', function (e) {
        e.preventDefault();
    });
    document.addEventListener('cut', function (e) {
        e.preventDefault();
    });

    // 3. مسدود کردن میانبرهای کیبورد (Ctrl+P برای چاپ، Ctrl+S برای ذخیره، Ctrl+U برای سورس، F12)
    document.addEventListener('keydown', function (e) {
        // جلوگیری از F12
        if (e.key === 'F12') {
            e.preventDefault();
        }
        
        // جلوگیری از ترکیب‌های Ctrl
        if (e.ctrlKey || e.metaKey) {
            const forbiddenKeys = ['p', 's', 'u', 'c', 'x', 'a']; // چاپ، ذخیره، سورس، کپی، کات، انتخاب همه
            if (forbiddenKeys.includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        }
    });


    // ========================================================================
    // بخش دوم: موتور بازرسی و اسکن محیطی جاوااسکریپت
    // ========================================================================
    
    const startScanBtn = document.getElementById('startScanBtn');
    const resultsArea = document.getElementById('resultsArea');
    const finalVerdict = document.getElementById('finalVerdict');

    // تعریف آزمون‌های امنیتی
    const securityChecks = [
        {
            title: 'بررسی وضعیت شبکه (ارتباطات)',
            execute: () => {
                if (navigator.onLine) {
                    return {
                        status: 'warn',
                        icon: '⚠️',
                        message: 'شما به اینترنت متصل هستید! برای امنیت ۱۰۰٪ اسناد محرمانه، وای‌فای یا کابل شبکه را قطع کنید.'
                    };
                } else {
                    return {
                        status: 'safe',
                        icon: '✅',
                        message: 'سیستم کاملاً آفلاین است. خطر خروج اطلاعات از طریق شبکه وجود ندارد.'
                    };
                }
            }
        },
        {
            title: 'بررسی محیط اجرای فایل (ایزوله بودن)',
            execute: () => {
                if (window.location.protocol === 'file:') {
                    return {
                        status: 'safe',
                        icon: '✅',
                        message: 'فایل به صورت آفلاین (Local) اجرا شده و روی هیچ سرور وب قرار ندارد.'
                    };
                } else {
                    return {
                        status: 'danger',
                        icon: '🚨',
                        message: 'فایل روی سرور (http/https) اجرا شده است! احتمال شنود ترافیک وجود دارد.'
                    };
                }
            }
        },
        {
            title: 'تشخیص ربات‌ها و اسکریپت‌های اتوماسیون',
            execute: () => {
                // هکرها معمولا با Selenium مرورگر را کنترل می‌کنند
                if (navigator.webdriver) {
                    return {
                        status: 'danger',
                        icon: '🚨',
                        message: 'سیستم تشخیص داد که مرورگر توسط یک نرم‌افزار خودکار یا ربات جاسوسی کنترل می‌شود!'
                    };
                } else {
                    return {
                        status: 'safe',
                        icon: '✅',
                        message: 'هیچ ربات یا نرم‌افزار کنترل از راه دور مرورگر (Webdriver) تشخیص داده نشد.'
                    };
                }
            }
        },
        {
            title: 'تشخیص ابزارهای توسعه‌دهنده (مهندسی معکوس)',
            execute: () => {
                // اگر هکر پنل F12 را باز کند، تفاوت ابعاد داخلی و خارجی مرورگر زیاد می‌شود
                const threshold = 160; 
                const widthDiff = window.outerWidth - window.innerWidth > threshold;
                const heightDiff = window.outerHeight - window.innerHeight > threshold;
                
                if (widthDiff || heightDiff) {
                    return {
                        status: 'warn',
                        icon: '⚠️',
                        message: 'احتمال باز بودن پنل هک/توسعه‌دهنده (F12) وجود دارد. ابعاد پنجره مشکوک است.'
                    };
                } else {
                    return {
                        status: 'safe',
                        icon: '✅',
                        message: 'ابزارهای مهندسی معکوس در مرورگر بسته به نظر می‌رسند.'
                    };
                }
            }
        },
        {
            title: 'تأییدیه قفل‌های رابط کاربری',
            execute: () => {
                return {
                    status: 'safe',
                    icon: '🔒',
                    message: 'کلیک‌راست، میانبرهای کپی/ذخیره، و قابلیت پرینت‌گرفتن با موفقیت در این تب مسدود شدند.'
                };
            }
        }
    ];

    // تابع اجرای انیمیشنی اسکن‌ها
    async function runSecurityAudit() {
        startScanBtn.disabled = true;
        startScanBtn.textContent = '⏳ در حال آنالیز لایه‌های امنیتی...';
        resultsArea.innerHTML = '';
        finalVerdict.style.display = 'none';
        finalVerdict.className = 'final-verdict';

        let dangerCount = 0;
        let warnCount = 0;

        for (let i = 0; i < securityChecks.length; i++) {
            // تاخیر مصنوعی برای دیده شدن روند اسکن
            await new Promise(resolve => setTimeout(resolve, 800));

            const check = securityChecks[i];
            const result = check.execute();

            if (result.status === 'danger') dangerCount++;
            if (result.status === 'warn') warnCount++;

            // ساخت عنصر نتیجه
            const itemDiv = document.createElement('div');
            itemDiv.className = `check-item ${result.status}`;
            
            itemDiv.innerHTML = `
                <div class="check-title ${result.status}">
                    <span>${result.icon}</span>
                    <span>${check.title}</span>
                </div>
                <div class="check-desc">${result.message}</div>
            `;
            
            resultsArea.appendChild(itemDiv);
            
            // اجرای انیمیشن نمایش
            setTimeout(() => {
                itemDiv.classList.add('visible');
            }, 50);
        }

        // نتیجه‌گیری نهایی
        setTimeout(() => {
            finalVerdict.style.display = 'block';
            if (dangerCount > 0) {
                finalVerdict.classList.add('verdict-danger');
                finalVerdict.innerHTML = '❌ خطر: محیط شما ناامن است. از باز کردن اسناد محرمانه خودداری کنید!';
            } else if (warnCount > 0) {
                finalVerdict.classList.add('verdict-safe');
                finalVerdict.style.color = 'var(--warning)';
                finalVerdict.style.borderColor = 'var(--warning)';
                finalVerdict.style.backgroundColor = 'rgba(210, 153, 34, 0.1)';
                finalVerdict.innerHTML = '⚠️ هشدار: سیستم امن است اما مواردی (مثل اتصال به اینترنت) باید رعایت شود.';
            } else {
                finalVerdict.classList.add('verdict-safe');
                finalVerdict.innerHTML = '✅ تأیید: مرورگر شما در امن‌ترین حالت فیزیکی و ایزوله قرار دارد.';
            }
            
            startScanBtn.textContent = '🔄 اسکن مجدد';
            startScanBtn.disabled = false;
        }, 1000);
    }

    startScanBtn.addEventListener('click', runSecurityAudit);

</script>
</body>
</html>
