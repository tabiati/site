<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل ارسال پیام همگانی تلگرام</title>
  <style>
    body {
      font-family: Tahoma, 'Segoe UI', sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .panel-card {
      background: #ffffff;
      max-width: 500px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
      padding: 30px;
      box-sizing: border-box;
    }
    .panel-card h2 {
      margin-top: 0;
      color: #1a202c;
      font-size: 20px;
      text-align: center;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 15px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #4a5568;
      font-size: 14px;
    }
    input[type="password"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    input[type="password"]:focus, textarea:focus {
      border-color: #2b6cb0;
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.15);
    }
    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.6;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #2b6cb0;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2c5282;
    }
    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
    #resultBox {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      line-height: 1.8;
    }
    .success-box {
      background-color: #f0fff4;
      border: 1px solid #9ae6b4;
      color: #22543d;
    }
    .error-box {
      background-color: #fff5f5;
      border: 1px solid #feb2b2;
      color: #742a2a;
    }
  </style>
</head>
<body>

<div class="panel-card">
  <h2>📢 پنل ارسال پیام همگانی تلگرام</h2>

  <div class="form-group">
    <label for="adminPass">🔑 رمز عبور پنل:</label>
    <input type="password" id="adminPass" placeholder="رمز عبور مدیریت را وارد نمایید...">
  </div>

  <div class="form-group">
    <label for="msgBody">📝 متن پیام ارسالی:</label>
    <textarea id="msgBody" placeholder="متن پیام خود را اینجا بنویسید..."></textarea>
  </div>

  <button id="sendBtn" onclick="sendBroadcast()">🚀 ارسال پیام به تمامی کاربران</button>

  <div id="resultBox"></div>
</div>

<script>
  // لینک اختصاصی اسکریپت شما
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxd_jv7FTJuvUDKZgMVRdMjKDpc9QLDvF9fhXkpVf3KpTPETY1DW21TxN5npEdHF6g1Kg/exec";

  async function sendBroadcast() {
    const password = document.getElementById("adminPass").value;
    const message = document.getElementById("msgBody").value;
    const resultBox = document.getElementById("resultBox");
    const sendBtn = document.getElementById("sendBtn");

    if (!password) {
      alert("لطفاً رمز عبور مدیریت را وارد کنید!");
      return;
    }
    if (!message.trim()) {
      alert("لطفاً متن پیام را وارد کنید!");
      return;
    }

    if (!confirm("آیا از ارسال این پیام برای تمام مخاطبان ربات اطمینان دارید؟")) {
      return;
    }

    // تغییر وضعیت به حالت در حال ارسال
    sendBtn.disabled = true;
    sendBtn.innerText = "⏳ در حال ارسال پیام‌ها، لطفاً صبر کنید...";
    resultBox.style.display = "none";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ password: password, message: message })
      });

      const data = await response.json();
      resultBox.style.display = "block";

      if (data.ok) {
        resultBox.className = "success-box";
        resultBox.innerHTML = `
          ✅ <b>گزارش ارسال موفق:</b><br>
          👥 کل مخاطبان: <b>${data.total}</b> نفر<br>
          ✔️ ارسال موفق: <b>${data.success}</b> پیام<br>
          ❌ ناموفق / بلاک‌شده: <b>${data.failed}</b> نفر
        `;
        document.getElementById("msgBody").value = "";
      } else {
        resultBox.className = "error-box";
        resultBox.innerHTML = `⚠️ <b>خطا:</b> ${data.error}`;
      }
    } catch (err) {
      resultBox.style.display = "block";
      resultBox.className = "error-box";
      resultBox.innerHTML = `⚠️ <b>خطا در ارسال:</b> ارتباط با سرور برقرار نشد (${err.message})`;
    } finally {
      sendBtn.disabled = false;
      sendBtn.innerText = "🚀 ارسال پیام به تمامی کاربران";
    }
  }
</script>

</body>
</html>
