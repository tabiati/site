<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل ارسال پیام همگانی تلگرام - طبیعتی سبز گستر</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .card {
      background: #ffffff;
      max-width: 520px;
      width: 100%;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border-top: 6px solid #0088cc;
    }
    h2 {
      margin-top: 0;
      color: #0088cc;
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 0.88rem;
      color: #333;
    }
    input[type="password"], textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cfd8dc;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border 0.3s;
      outline: none;
    }
    input[type="password"]:focus, textarea:focus {
      border-color: #0088cc;
    }
    textarea {
      resize: vertical;
      min-height: 140px;
      line-height: 1.6;
    }
    .btn {
      width: 100%;
      background: #0088cc;
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #006699;
    }
    .btn:disabled {
      background: #9e9e9e;
      cursor: not-allowed;
    }
    #statusBox {
      margin-top: 15px;
      padding: 14px;
      border-radius: 8px;
      display: none;
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre-line;
      text-align: right;
    }
    .success {
      background-color: #e1f5fe;
      color: #01579b;
      border: 1px solid #b3e5fc;
    }
    .error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }
    .loading {
      background-color: #e3f2fd;
      color: #1565c0;
      border: 1px solid #bbdefb;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>✈️ پنل مدیریت و ارسال پیام همگانی تلگرام</h2>
  
  <form id="broadcastForm">
    <div class="form-group">
      <label for="password">🔑 رمز عبور مدیریت:</label>
      <input type="password" id="password" placeholder="رمز عبور مدیریت را وارد کنید" required>
    </div>

    <div class="form-group">
      <label for="message">✍️ متن پیام ارسالی:</label>
      <textarea id="message" placeholder="متن پیام خود را برای کاربران تلگرام بنویسید..." required></textarea>
    </div>

    <button type="submit" id="submitBtn" class="btn">🚀 ارسال پیام به تمام کاربران تلگرام</button>
  </form>

  <div id="statusBox"></div>
</div>

<script>
  // آدرس اسکریپت تلگرام شما
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsxLB4cRmxgLr8cExjvyHBooEIuKymuVI1E6eN2YEvhGG-nI927ODGE5RRsjNKr4UP/exec';

  const form = document.getElementById('broadcastForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusBox = document.getElementById('statusBox');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = document.getElementById('password').value.trim();
    const message = document.getElementById('message').value.trim();

    if (!confirm('آیا از ارسال این پیام به تمام کاربران تلگرام اطمینان دارید؟')) {
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = 'در حال ارسال پیام‌ها به تلگرام...';
    showStatus('در حال ارسال پیام‌ها به کاربران فعال با سرعت ۴ پیام در ثانیه...', 'loading');

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'admin_broadcast_telegram',
          password: password,
          message: message
        })
      });

      const resData = await response.json();

      if (resData.status === 'success') {
        showStatus(resData.message, 'success');
        document.getElementById('message').value = '';
      } else {
        showStatus('❌ خطا: ' + resData.message, 'error');
      }
    } catch (err) {
      showStatus('❌ خطا در برقراری ارتباط با سرور تلگرام!', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = '🚀 ارسال پیام به تمام کاربران تلگرام';
    }
  });

  function showStatus(text, type) {
    statusBox.innerText = text;
    statusBox.className = type;
    statusBox.style.display = 'block';
  }
</script>

</body>
</html>
