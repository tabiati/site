<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل ارسال پیام همگانی تلگرام</title>
  <style>
    body {
      font-family: Tahoma, 'Segoe UI', sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 520px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: #2c7a4b;
      font-size: 20px;
      text-align: center;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      color: #333;
      font-size: 14px;
    }
    input[type="password"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    input[type="password"]:focus, textarea:focus {
      border-color: #2c7a4b;
    }
    textarea {
      height: 140px;
      resize: vertical;
    }
    button {
      width: 100%;
      background-color: #2c7a4b;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #225f3a;
    }
    button:disabled {
      background-color: #94c4a6;
      cursor: not-allowed;
    }
    #resultBox {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    .success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }
    .error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }
    .loading {
      background-color: #e3f2fd;
      color: #1565c0;
      border: 1px solid #90caf9;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🌿 ارسال پیام به کاربران تلگرام</h2>
    
    <label for="password">🔑 رمز عبور مدیریت:</label>
    <input type="password" id="password" placeholder="رمز تعریف‌شده در اسکریپت را وارد کنید">

    <label for="message">📝 متن پیام همگانی:</label>
    <textarea id="message" placeholder="متن پیام تبریک، اطلاع‌رسانی یا تخفیف را اینجا بنویسید..."></textarea>

    <button id="sendBtn" onclick="sendBroadcast()">🚀 ارسال پیام به همه کاربران</button>

    <div id="resultBox"></div>
  </div>

  <script>
    // آدرس وب‌اپ گوگل اسکریپت شما
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwvpI-jiT6Wnv8M3t8rFGyhGcSWNDr8DsCQNL7HHqYeBrLUppVsJ1Hx86uOAxgyNr7R/exec";

    async function sendBroadcast() {
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message").value.trim();
      const btn = document.getElementById("sendBtn");
      const resultBox = document.getElementById("resultBox");

      if (!password) {
        alert("لطفاً رمز عبور مدیریت را وارد کنید.");
        return;
      }
      if (!message) {
        alert("لطفاً متن پیام را وارد کنید.");
        return;
      }

      // تاییدیه نهایی قبل از ارسال
      if (!confirm("آیا از ارسال این پیام برای تمام کاربران مطمئن هستید؟")) {
        return;
      }

      btn.disabled = true;
      btn.innerText = "⏳ در حال ارسال به کاربران...";
      resultBox.style.display = "block";
      resultBox.className = "loading";
      resultBox.innerHTML = "پیام در حال ارسال به لیست اعضا می‌باشد، لطفاً شکیبا باشید...";

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "send_broadcast",
            password: password,
            message: message
          })
        });

        const data = await response.json();

        if (data.success) {
          resultBox.className = "success";
          resultBox.innerHTML = `
            <strong>✅ عملیات با موفقیت انجام شد!</strong><br>
            ▫️ تعداد پیام موفق: <b>${data.sent}</b> کاربر<br>
            ▫️ تعداد پیام ناموفق (بلاک یا خطا): <b>${data.failed}</b> کاربر
          `;
          document.getElementById("message").value = "";
        } else {
          resultBox.className = "error";
          resultBox.innerHTML = `❌ <b>خطا:</b> ${data.message || "مشکلی در انجام عملیات پیش آمد."}`;
        }
      } catch (err) {
        resultBox.className = "error";
        resultBox.innerHTML = "❌ خطا در برقراری ارتباط با سرور گوگل. لطفاً اتصال اینترنت خود را بررسی کنید.";
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 ارسال پیام به همه کاربران";
      }
    }
  </script>
</body>
</html>
